name: daily-balance-regression

# 全量回归：main 提交即触发 + 每日 02:00 UTC 定时 + 手动触发
# 内容：unittest/pytest 全量用例 → 平衡回归（漂移检测）→ W3 数据报告 → 摘要 + 产物归档
on:
  push:
    branches: [main]        # 提交即回归：避免"失败了 5 天才发现"
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  balance-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # 修复：仓库没有 requirements.txt / pyproject.toml，
          # 而 cache: pip 默认只找这两个文件，找不到会直接 fail 并 skip 掉后面所有测试步骤。
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖（pytest 全家桶可选；引擎零第三方依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 全量测试（unittest / pytest 双运行器，同一批用例）
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee results/unittest.log
          # 用例数动态取自 pytest 收集结果，避免文案里的数字过期
          python -m pytest --collect-only -q 2>&1 | tail -n 1 | tee results/test-count.txt

      - name: 每日平衡回归（确定性，含最强编队漂移检测）
        run: |
          set -o pipefail                     # 防 tee 吞掉失败退出码
          python scripts/ci_daily_balance.py 2>&1 | tee results/daily-balance.log

      - name: W3 数据报告（模拟/招募 → SQLite → 6 条 SQL）
        run: |
          set -o pipefail
          python scripts/w3_report.py --db results/w3.db 2>&1 | tee results/w3-report.log

      - name: 结果摘要写入 Job Summary
        if: always()
        run: |
          {
            echo "### daily-balance-regression"
            echo ""
            echo "- 用例收集：$(cat results/test-count.txt 2>/dev/null || echo '未执行')"
            echo "- 全量测试：$(grep -E '^(Ran |OK|FAILED)' results/unittest.log 2>/dev/null | tr '\n' ' ' || echo '未执行')"
            echo ""
            echo "<details><summary>平衡回归输出（尾部 15 行）</summary>"
            echo ""
            echo '```text'
            tail -n 15 results/daily-balance.log 2>/dev/null || echo "(无平衡回归日志)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物（SQLite 库 / 基线 / 报告目录）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-artifacts
          path: |
            results/*.db
            results/baseline.json
            results/*.log
            results/test-count.txt
          if-no-files-found: ignore
