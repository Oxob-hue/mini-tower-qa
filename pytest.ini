[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
markers =
    smoke: W1 冒烟（引擎可跑/确定性/结局语义）
    rules: W2 规则与边界用例矩阵（DMG/SKL/TGT/STG）
    probability: W3 概率假设检验（招募）
    balance: W3 平衡回归与膨胀/克制校验
    data: W3 SQLite 数据层与 SQL
    perf: W4 性能守卫/伸缩曲线/基线机制
    tuning: W4 改数值→红→调参→绿 故事线
    ai: W5 AI 辅助三道闸
